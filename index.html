<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈의 라면집</title>
    <link href="index.css" rel="stylesheet">
</head>

<body>

    <!-- 여기부터 게임 화면 -->
    <div class="game">

        <!-- 위쪽 -->
        <div class="header">

            <!-- 재료들 -->
            <div class="ingredients">
                <img draggable="false" class="ingredient" src="https://placehold.co/170x85/e74c3c/fff?text=스프" alt="라면 스프">
                <img draggable="false" class="ingredient" src="https://placehold.co/170x85/f1c40f/333?text=면" alt="라면 면">
                <img draggable="false" class="ingredient" src="https://placehold.co/170x85/2ecc71/fff?text=파" alt="파">
                <img draggable="false" class="ingredient" src="https://placehold.co/170x85/ffffff/333?text=계란" alt="계란">
            </div>

            <!-- 타이머랑 제목 -->
            <div class="status">
                <div class="timer">
                    <span class="label">Time</span>
                    <div class="timer-bar">
                        <div class="timer-fill"></div>
                    </div>
                </div>
                <h1 class="title">슈의 라면집</h1>
            </div>

            <!-- 벌어든 돈 -->
            <div class="scoreboard">
                <div class="score-label">수입금</div>
                <div class="score-display">0</div>
            </div>

        </div>

        <!-- 가운데 (제일 중요한 부분) -->
        <div class="kitchen">

            <!-- 가스레인지, 냄비 4개 + 주전자 -->
            <div class="stove">
                <div class="burner">
                    <img draggable="false" class="pot" src="https://placehold.co/80x70/f1c40f/333?text=냄비" alt="냄비">
                    <img draggable="false" class="fire" src="https://placehold.co/60x40/ff6600/fff?text=🔥" alt="불">
                </div>
                <div class="burner">
                    <img draggable="false" class="pot" src="https://placehold.co/80x70/f1c40f/333?text=냄비" alt="냄비">
                    <img draggable="false" class="fire" src="https://placehold.co/60x40/ff6600/fff?text=🔥" alt="불">
                </div>
                <div class="burner kettle-burner active">
                    <img draggable="false" class="kettle" src="https://placehold.co/90x80/ffd700/333?text=주전자" alt="주전자">
                    <img draggable="false" class="fire" src="https://placehold.co/60x40/ff6600/fff?text=🔥" alt="불">
                </div>
                <div class="burner active">
                    <img draggable="false" class="pot" src="https://placehold.co/80x70/f1c40f/333?text=냄비" alt="냄비">
                    <img draggable="false" class="fire" src="https://placehold.co/60x40/ff6600/fff?text=🔥" alt="불">
                </div>
                <div class="burner">
                    <img draggable="false" class="pot" src="https://placehold.co/80x70/f1c40f/333?text=냄비" alt="냄비">
                    <img draggable="false" class="fire" src="https://placehold.co/60x40/ff6600/fff?text=🔥" alt="불">
                </div>
            </div>

            <!-- 완성한 라면 내놓는 곳 -->
            <div class="serving">
                <div class="wall">
                    <img draggable="false" src="https://placehold.co/40x40/ccc/666?text=🥄" alt="주걱">
                    <img draggable="false" src="https://placehold.co/40x40/ccc/666?text=🍳" alt="뒤집개">
                    <img draggable="false" src="https://placehold.co/40x40/ccc/666?text=🥢" alt="국자">
                </div>
                <div class="tray"></div>
            </div>

        </div>

        <!-- 아래쪽, 노브랑 메모 -->
        <div class="footer">
            <div class="knobs">
                <img draggable="false" src="https://placehold.co/48x48/ff69b4/fff?text=●" alt="노브">
                <img draggable="false" src="https://placehold.co/48x48/ff69b4/fff?text=●" alt="노브">
                <img draggable="false" src="https://placehold.co/48x48/ff69b4/fff?text=●" alt="노브">
                <img draggable="false" src="https://placehold.co/48x48/ff69b4/fff?text=●" alt="노브">
            </div>
            <div class="notes">
                <div class="note note-yellow">맛에 따라 돈을 내는 슈의 라면집!!!</div>
                <div class="note note-blue">라면: 1,000원</div>
            </div>
        </div>

    </div>

    <script type="module" src="index.js"></script>
</body>

</html>
